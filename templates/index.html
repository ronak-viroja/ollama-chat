<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ollama Chat</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="/static/css/prism.css">
</head>
<body>
    <div class="container">
        <h1>Ollama Chat</h1>
        <div class="conversation-type">
            <select id="conv-type">
                <option value="chat">Chat</option>
                <option value="code">Code</option>
                <option value="debug">Debug</option>
            </select>
        </div>
        <div class="chat-window" id="chat-window"></div>
        <div class="input-area">
            <input type="file" id="file-input" style="display: none;">
            <button onclick="document.getElementById('file-input').click()">Attach File</button>
            <textarea id="message" placeholder="Type your message..." rows="3"></textarea>
            <select id="model" style="margin-left: 10px;">
                <option value="">Select Model</option>
            </select>
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
    <script src="/static/js/prism.js"></script>
    <script src="/static/js/script.js"></script>
</body>
</html>
